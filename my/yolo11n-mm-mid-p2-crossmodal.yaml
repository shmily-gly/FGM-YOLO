# YOLOMM: strict cross-modal P2-P5 detection pyramid
# Innovation 2 only: keep P4/P5 Concat and inject RGB+IR side features at P2/P3.
# Use this file to isolate the multi-scale cross-modal topology.

nc: 7
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

  # IR branch
  - [-1, 1, Conv, [64, 3, 2], 'X']
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

  # P4/P5 baseline cross-modal fusion
  - [[6, 17], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[10, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, C2PSA, [1024]]

head:
  # FPN: P5 -> P4 -> P3 -> P2
  - [26, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  # Strict cross-modal P3 side connection.
  - [[-1, 4, 15], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  # Strict cross-modal P2 side connection.
  - [[-1, 2, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]

  # PAN: P2 -> P3 -> P4 -> P5
  - [35, 1, Conv, [128, 3, 2]]
  - [[-1, 32], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 29], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 26], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[35, 38, 41, 44], 1, Detect, [nc]]
