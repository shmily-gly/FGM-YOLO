# Ultralytics YOLOMM - Mid-Fusion with DeformableInteractiveAttention (DIAM)

nc: 80
scales:
  n: [0.5, 0.25, 1024]
  s: [0.5, 0.5, 1024]
  m: [0.5, 1.0, 512]
  l: [1.0, 1.0, 512]
  x: [1.0, 1.5, 512]

backbone:
  # [from, number, module, args, tag]
  
  # --- RGB 分支 ---
  - [-1, 1, Conv, [64, 3, 2], "RGB"]     # 0: RGB 输入下采样
  - [-1, 1, Conv, [128, 3, 2]]           # 1
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5]]             # 9
  - [-1, 2, C2PSA, [1024]]               # 10

  # --- X 分支 (例如深度图/红外等) ---
  - [-1, 1, Conv, [64, 3, 2], "X"]       # 11: X 输入下采样
  - [-1, 1, Conv, [128, 3, 2]]           # 12
  - [-1, 2, C3k2, [256, False, 0.25]]    # 13
  - [-1, 1, Conv, [256, 3, 2]]           # 14
  - [-1, 2, C3k2, [512, False, 0.25]]    # 15
  - [-1, 1, Conv, [512, 3, 2]]           # 16
  - [-1, 2, C3k2, [512, True]]           # 17
  - [-1, 1, Conv, [1024, 3, 2]]          # 18
  - [-1, 2, C3k2, [1024, True]]          # 19
  - [-1, 1, SPPF, [1024, 5]]             # 20
  - [-1, 2, C2PSA, [1024]]               # 21

  # --- Mid-Fusion 融合层 ---
  - [[6, 17], 1, Concat, [1]]            # 22: 融合 RGB 和 X 的浅层特征
  - [-1, 2, C3k2, [1024, True]]          # 23
  - [[10, 21], 1, Concat, [1]]           # 24: 融合 RGB 和 X 的深层特征
  - [-1, 2, C3k2, [1024, True]]          # 25
  - [-1, 1, DeformableInteractiveAttention, []] # 26: DIAM 注意力模块

head:
  # [from, number, module, args]
  
  # --- FPN 自顶向下 ---
  - [26, 1, nn.Upsample, [None, 2, "nearest"]] # 27
  - [[-1, 23], 1, Concat, [1]]               # 28: 拼接 Neck 上采样特征
  - [-1, 2, C3k2, [512, False]]              # 29

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 30
  - [[-1, 4], 1, Concat, [1]]                # 31: 拼接更浅层特征
  - [-1, 2, C3k2, [256, False]]              # 32

  # --- PAN 自底向上 ---
  - [-1, 1, Conv, [256, 3, 2]]               # 33: 下采样
  - [[-1, 29], 1, Concat, [1]]               # 34
  - [-1, 2, C3k2, [512, False]]              # 35

  - [-1, 1, Conv, [512, 3, 2]]               # 36: 下采样
  - [[-1, 26], 1, Concat, [1]]               # 37: 拼接 DIAM 输出特征
  - [-1, 2, C3k2, [1024, True]]              # 38

  # --- 多尺度检测头 ---
  - [[32, 35, 38], 1, Detect, [nc]]          # 39: Detect(P3, P4, P5)